[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  # CRA treats lint warnings as errors when CI=true; don't fail the deploy on them.
  CI = "false"
  NPM_FLAGS = "--legacy-peer-deps"

# Serverless functions (paths are relative to the "frontend" base directory).
# calendly-booking-background turns paid Calendly bookings into a meeting-prep deck.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/apex-mark-white.png"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
